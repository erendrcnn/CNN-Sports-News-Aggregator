# Pre-commit configuration file for automated code quality checks
# 
# Usage:
#   1. Install pre-commit: pip install pre-commit
#   2. Install the git hook scripts: pre-commit install
#   3. (Optional) Run against all files: pre-commit run --all-files
#   4. Commit your code - hooks will run automatically before commit
#
# Purpose:
#   This configuration defines hooks that run automatically before each git commit
#   to catch code quality issues, formatting problems, and security vulnerabilities
#   early in the development process.
#
# Features:
#   - Prevents commits with issues
#   - Enforces consistent code style
#   - Runs linters and formatters
#   - Catches common mistakes
#
# Configuration:
#   - repos: List of repositories containing pre-commit hooks
#   - hooks: Individual checks to run from each repository
#   - stages: When hooks run (commit, push, manual, etc.)
#   - exclude: Patterns for files to skip

repos:
  # Python hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        files: ^backend/

  # Flake8 - Python linter
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        files: ^backend/
        args: ['--max-line-length=88', '--extend-ignore=E203,W503']

  # isort - Python import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/
        args: ['--profile', 'black']

  # ESLint - JavaScript linter
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(js|jsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.55.0
          - eslint-config-react-app@7.0.1

  # Prettier - Code formatter for JS/JSON/CSS
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(js|jsx|json|css)$
        additional_dependencies:
          - prettier@3.1.1
